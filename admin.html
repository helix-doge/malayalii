<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel – Malayali Store</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<h1>Admin Panel</h1>

<section class="card">
  <h2 id="formTitle">Add App</h2>

  <input id="appName" placeholder="App Name">
  <textarea id="appDesc" placeholder="App Description"></textarea>

  <select id="platform">
    <option value="android">Android</option>
    <option value="ios">iOS / iPad</option>
  </select>

  <input type="file" id="appIcon">

  <h3>Plans</h3>
  <div id="plansList"></div>
  <button onclick="addPlan()">+ Add Plan</button>

  <button class="primary" onclick="saveApp()">Save App</button>
</section>

<section class="card">
  <h2>Existing Apps</h2>
  <div id="appsList"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/admin.js"></script>
</body>
</html>
