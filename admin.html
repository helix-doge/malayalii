<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<header>
  <h1>Malayali Here</h1>
  <p>Admin Panel</p>
</header>

<main>
  <!-- DASHBOARD -->
  <section id="dashboard" class="page active">
    <h2>Dashboard</h2>
    <div class="stats">
      <div><b id="statApps">0</b><span>Apps</span></div>
      <div><b id="statPlans">0</b><span>Plans</span></div>
      <div><b id="statKeys">0</b><span>Keys</span></div>
    </div>
  </section>

  <!-- APPS -->
  <section id="apps" class="page">
    <h2>Apps</h2>
    <button id="openAdd">+ Add App</button>
    <div id="appsList"></div>
  </section>

  <!-- ADD / EDIT APP -->
  <section id="appForm" class="page">
    <h2 id="formTitle">Add App</h2>

    <input id="appName" placeholder="App name">
    <select id="platform">
      <option value="android">Android</option>
      <option value="ios">iOS</option>
    </select>
    <textarea id="description" placeholder="Description"></textarea>

    <input type="file" id="iconFile">

    <h3>Plans</h3>
    <div id="plans"></div>
    <button id="addPlan">+ Add Plan</button>

    <button id="saveApp">Save App</button>
    <button id="deleteApp" class="danger hidden">Delete App</button>
  </section>

  <!-- KEYS -->
  <section id="keys" class="page">
    <h2>Keys</h2>

    <select id="keyApp"></select>
    <select id="keyPlan"></select>

    <textarea id="keyInput" placeholder="One key per line"></textarea>
    <button id="saveKeys">Save Keys</button>

    <p id="keyInfo"></p>
  </section>
</main>

<nav>
  <button data-page="dashboard">Dashboard</button>
  <button data-page="apps">Apps</button>
  <button data-page="keys">Keys</button>
</nav>

<script type="module" src="admin.js"></script>
</body>
</html>
