<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel – Malayali Store</title>

  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<header>
  <h1>Admin Panel</h1>
  <p>Manage Apps, Icons & Plans</p>
</header>

<main>
  <!-- ADD / EDIT APP -->
  <section class="card">
    <h2 id="formTitle">Add New App</h2>

    <input id="appName" placeholder="App Name">
    <textarea id="appDesc" placeholder="App Description"></textarea>

    <select id="platform">
      <option value="android">Android</option>
      <option value="ios">iOS / iPad</option>
    </select>

    <label class="file-label">
      Upload App Icon
      <input type="file" id="appIcon" hidden>
    </label>

    <h3>Plans</h3>
    <div id="plansList"></div>

    <button class="secondary" onclick="addPlan()">+ Add Plan</button>
    <button class="primary" onclick="saveApp()">Save App</button>
  </section>

  <!-- EXISTING APPS -->
  <section class="card">
    <h2>Existing Apps</h2>
    <div id="appsList"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/admin.js"></script>
</body>
</html>
