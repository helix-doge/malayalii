<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<header>
  <h1>Admin Panel</h1>
</header>

<nav>
  <button onclick="showPage('apps')">Apps</button>
  <button onclick="showPage('add')">Add App</button>
</nav>

<section id="apps" class="page">
  <select id="filter">
    <option value="all">All</option>
    <option value="android">Android</option>
    <option value="ios">iOS</option>
  </select>

  <div id="appsList" class="grid"></div>
</section>

<section id="add" class="page">
  <input id="appName" placeholder="App Name">
  <select id="platform">
    <option value="android">Android</option>
    <option value="ios">iOS</option>
  </select>
  <textarea id="description" placeholder="Description"></textarea>

  <input type="file" id="iconFile">

  <h3>Plans</h3>
  <div id="plans"></div>
  <button onclick="addPlan()">+ Add Plan</button>

  <button id="saveApp">Save App</button>
</section>

<script type="module" src="admin.js"></script>
</body>
</html>
