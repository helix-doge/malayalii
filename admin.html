<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Malayali Here – Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="header">
  <h1>Malayali Here</h1>
  <span>Admin Panel</span>
</header>

<main>

<!-- DASHBOARD -->
<section id="page-dashboard" class="page active">
  <h2>Dashboard</h2>

  <div class="stats">
    <div class="stat"><b id="statTotal">0</b><span>Apps</span></div>
    <div class="stat"><b id="statAndroid">0</b><span>Android</span></div>
    <div class="stat"><b id="statIos">0</b><span>iOS</span></div>
    <div class="stat"><b id="statPlans">0</b><span>Plans</span></div>
  </div>
</section>

<!-- APPS -->
<section id="page-apps" class="page">
  <h2>Apps</h2>

  <select id="filter">
    <option value="all">All</option>
    <option value="android">Android</option>
    <option value="ios">iOS</option>
  </select>

  <div id="appsList" class="apps-list"></div>
</section>

<!-- ADD / EDIT -->
<section id="page-add" class="page">
  <h2 id="formTitle">Add App</h2>

  <input id="appName" placeholder="App name">
  <select id="platform">
    <option value="android">Android</option>
    <option value="ios">iOS</option>
  </select>

  <textarea id="description" placeholder="Description"></textarea>

  <input type="file" id="iconFile" accept="image/*">

  <h3>Plans</h3>
  <div id="plans"></div>
  <button id="addPlanBtn">+ Add Plan</button>

  <button id="saveBtn" class="primary">Save</button>
  <button id="deleteBtn" class="danger hidden">Delete App</button>
</section>

</main>

<!-- BOTTOM NAV (MOBILE FRIENDLY) -->
<nav class="bottom-nav">
  <button id="navDashboard" class="active">Dashboard</button>
  <button id="navApps">Apps</button>
  <button id="navAdd">Add App</button>
</nav>

<script type="module" src="admin.js"></script>
</body>
</html>
