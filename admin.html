<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="top">
  <h1>Malayali Here – Admin</h1>
</header>

<nav class="nav">
  <button id="btnApps">Apps</button>
  <button id="btnAdd">Add App</button>
</nav>

<main>

<!-- APPS PAGE -->
<section id="appsPage" class="page active">
  <div class="toolbar">
    <select id="filter">
      <option value="all">All</option>
      <option value="android">Android</option>
      <option value="ios">iOS</option>
    </select>
  </div>

  <div id="appsList" class="grid"></div>
</section>

<!-- ADD APP PAGE -->
<section id="addPage" class="page">
  <h2>Add App</h2>

  <input id="appName" placeholder="App name">
  <select id="platform">
    <option value="android">Android</option>
    <option value="ios">iOS</option>
  </select>
  <textarea id="description" placeholder="Description"></textarea>

  <input type="file" id="iconFile" accept="image/*">

  <h3>Plans</h3>
  <div id="plans"></div>
  <button id="addPlanBtn" type="button">+ Add Plan</button>

  <button id="saveAppBtn">Save App</button>
</section>

</main>

<script type="module" src="admin.js"></script>
</body>
</html>
