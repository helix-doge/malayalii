<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin | Malayali Here</title>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f4f7f6; padding: 20px; }
        .dashboard { max-width: 1000px; margin: auto; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 25px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
        .btn-add { width: 100%; padding: 15px; background: #000; color: #FFD700; border: none; font-weight: bold; cursor: pointer; border-radius: 8px; }
        
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        .del-btn { color: #ff3b30; border: none; background: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="card">
        <h2>PUBLISH NEW PRODUCT 🚀</h2>
        <input type="text" id="pName" placeholder="Product Name">
        <input type="number" id="pPrice" placeholder="Selling Price (₹)">
        <input type="text" id="pImage" placeholder="Direct Image URL">
        <select id="pCat">
            <option value="RC CARS">RC CARS</option>
            <option value="HOT WHEELS">HOT WHEELS</option>
            <option value="ELECTRONICS">ELECTRONICS</option>
        </select>
        <button class="btn-add" onclick="pushToStore()">ADD TO LIVE STORE</button>
    </div>

    <div class="card">
        <h2>LIVE INVENTORY MANAGER</h2>
        <div style="overflow-x: auto;">
            <table>
                <thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Action</th></tr></thead>
                <tbody id="inventory"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
    // USE SAME FIREBASE CONFIG AS ABOVE
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function pushToStore() {
        const product = {
            name: document.getElementById('pName').value,
            price: document.getElementById('pPrice').value,
            image: document.getElementById('pImage').value,
            category: document.getElementById('pCat').value
        };
        database.ref('products').push(product).then(() => location.reload());
    }

    database.ref('products').on('value', snap => {
        const list = document.getElementById('inventory');
        const data = snap.val();
        list.innerHTML = '';
        for (let id in data) {
            list.innerHTML += `<tr>
                <td>${data[id].name}</td>
                <td>${data[id].category}</td>
                <td>₹${data[id].price}</td>
                <td><button class="del-btn" onclick="removeItem('${id}')">DELETE</button></td>
            </tr>`;
        }
    });

    function removeItem(id) { if(confirm("Remove this item?")) database.ref('products/'+id).remove(); }
</script>
</body>
</html>
