<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<header>
  <h1>Malayali Here – Admin</h1>
</header>

<nav>
  <button id="btnDashboard">Dashboard</button>
  <button id="btnApps">Apps</button>
  <button id="btnAdd">Add App</button>
</nav>

<main>

<!-- DASHBOARD -->
<section id="dashboard" class="page show">
  <div class="stats">
    <div>Total Apps: <b id="statTotal">0</b></div>
    <div>Android: <b id="statAndroid">0</b></div>
    <div>iOS: <b id="statIos">0</b></div>
  </div>
</section>

<!-- APPS -->
<section id="apps" class="page">
  <select id="filter">
    <option value="all">All</option>
    <option value="android">Android</option>
    <option value="ios">iOS</option>
  </select>

  <div id="appsList" class="apps"></div>
</section>

<!-- ADD APP -->
<section id="add" class="page">
  <input id="appName" placeholder="App Name">
  <select id="platform">
    <option value="android">Android</option>
    <option value="ios">iOS</option>
  </select>
  <textarea id="description" placeholder="Description"></textarea>

  <input type="file" id="iconFile">

  <h3>Plans</h3>
  <div id="plans"></div>
  <button id="addPlan">+ Add Plan</button>

  <button id="saveApp">Save App</button>
</section>

</main>

<script type="module" src="admin.js"></script>
</body>
</html>
