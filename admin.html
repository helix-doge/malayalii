<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="topbar">
  <h1>Malayali Here – Admin</h1>
</header>

<nav class="sidebar">
  <button id="navDashboard" class="active">Dashboard</button>
  <button id="navApps">Apps</button>
</nav>

<main>

<!-- DASHBOARD -->
<section id="dashboard" class="page active">
  <div class="stats">
    <div class="stat">Total Apps<br><b id="statTotal">0</b></div>
    <div class="stat">Android Apps<br><b id="statAndroid">0</b></div>
    <div class="stat">iOS Apps<br><b id="statIos">0</b></div>
    <div class="stat">Total Plans<br><b id="statPlans">0</b></div>
  </div>
</section>

<!-- APPS LIST -->
<section id="apps" class="page">
  <div id="appsList" class="apps-grid"></div>
</section>

<!-- EDIT APP -->
<section id="edit" class="page">
  <h2>Edit App</h2>

  <input id="appName" placeholder="App Name">
  <textarea id="description" placeholder="Description"></textarea>

  <input type="file" id="iconFile">

  <h3>Plans</h3>
  <div id="plans"></div>
  <button id="addPlanBtn">+ Add Plan</button>

  <button id="saveBtn">Save Changes</button>
  <button id="deleteBtn" class="danger">Delete App</button>
</section>

</main>

<script type="module" src="admin.js"></script>
</body>
</html>
