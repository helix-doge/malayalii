<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="top">
  <h1>Malayali Here</h1>
  <p>Admin Panel</p>
</header>

<main>

<!-- DASHBOARD -->
<section id="page-dashboard" class="page active">
  <h2>Dashboard</h2>
  <div class="stats">
    <div class="stat"><b id="statApps">0</b><span>Apps</span></div>
    <div class="stat"><b id="statPlans">0</b><span>Plans</span></div>
    <div class="stat"><b id="statKeys">0</b><span>Keys</span></div>
  </div>
</section>

<!-- APPS -->
<section id="page-apps" class="page">
  <h2>Apps</h2>
  <select id="appFilter">
    <option value="all">All</option>
    <option value="android">Android</option>
    <option value="ios">iOS</option>
  </select>
  <div id="appsList" class="list"></div>
</section>

<!-- ADD / EDIT APP -->
<section id="page-add" class="page">
  <h2 id="formTitle">Add App</h2>

  <input id="appName" placeholder="App name">
  <select id="platform">
    <option value="android">Android</option>
    <option value="ios">iOS</option>
  </select>

  <textarea id="description" placeholder="Description"></textarea>
  <input type="file" id="iconFile" accept="image/*">

  <h3>Plans</h3>
  <div id="plans"></div>

  <button id="addPlanBtn" class="outline">+ Add Plan</button>
  <button id="saveAppBtn" class="primary">Save App</button>
  <button id="deleteAppBtn" class="danger hidden">Delete App</button>
</section>

<!-- KEY MANAGEMENT -->
<section id="page-keys" class="page">
  <h2>Key Management</h2>

  <div class="key-controls">
    <select id="filterApp">
      <option value="">All Apps</option>
    </select>

    <select id="filterStatus">
      <option value="">All Keys</option>
      <option value="available">Available</option>
      <option value="used">Used</option>
    </select>
  </div>

  <div class="key-stats">
    <span>Total: <b id="totalKeys">0</b></span>
    <span>Available: <b id="availableKeys">0</b></span>
    <span>Used: <b id="usedKeys">0</b></span>
  </div>

  <table class="keys-table">
    <thead>
      <tr>
        <th>App</th>
        <th>Plan</th>
        <th>Key</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="keysTableBody"></tbody>
  </table>
</section>

<!-- ADD KEYS (NEW PAGE) -->
<section id="page-add-keys" class="page">
  <h2>Add Keys</h2>

  <select id="keyAppSelect"></select>
  <select id="keyPlanSelect"></select>

  <textarea id="keyBulk" placeholder="Paste keys (one per line)"></textarea>

  <button id="saveKeysBtn" class="primary">Save Keys</button>
</section>

</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button data-page="dashboard" class="active">Dashboard</button>
  <button data-page="apps">Apps</button>
  <button data-page="add">Add App</button>
  <button data-page="keys">Keys</button>
  <button data-page="add-keys">Add Keys</button>
</nav>

<script type="module" src="admin.js"></script>
</body>
</html>
