<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Control | Malayali Here</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #FFD700; --bg: #0a0a0a; --card: #151515; --red: #ff4444; --green: #25D366; }
        * { margin:0; padding:0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: white; display: flex; min-height: 100vh; }

        /* Sidebar Navigation */
        .sidebar { width: 260px; background: #000; border-right: 1px solid #222; padding: 30px 20px; display: flex; flex-direction: column; position: fixed; height: 100vh; }
        .sidebar h2 { font-family: 'Orbitron'; color: var(--gold); font-size: 1.2rem; margin-bottom: 40px; text-align: center; }
        .nav-btn { background: none; border: none; color: #888; padding: 15px; text-align: left; cursor: pointer; font-size: 1rem; transition: 0.3s; border-radius: 8px; margin-bottom: 10px; }
        .nav-btn.active { background: var(--card); color: var(--gold); border-left: 4px solid var(--gold); }
        
        .main-content { flex: 1; margin-left: 260px; padding: 40px; }
        .tab-view { display: none; }
        .tab-view.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }

        /* Controls: Search, Sort, Filter */
        .controls-bar { display: flex; gap: 15px; margin-bottom: 25px; background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #222; flex-wrap: wrap; }
        .controls-bar select, .controls-bar input { flex: 1; min-width: 150px; margin: 0; padding: 10px; background: #222; border: 1px solid #444; color: white; border-radius: 6px; }

        /* Inventory Table */
        .inventory-table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; }
        .inventory-table th { background: #222; color: #777; text-align: left; padding: 15px; font-size: 0.8rem; text-transform: uppercase; }
        .inventory-table td { padding: 12px 15px; border-bottom: 1px solid #222; }
        
        /* Inline Editing Fields */
        .edit-input { width: 80px; padding: 5px; background: #333; border: 1px solid #555; color: var(--gold); border-radius: 4px; font-weight: bold; }
        
        .btn-group { display: flex; gap: 8px; }
        .action-btn { padding: 6px 12px; border-radius: 6px; cursor: pointer; border: none; font-size: 0.75rem; font-weight: 600; }
        .save-btn { background: var(--green); color: black; }
        .del-btn { background: var(--red); color: white; }

        /* Form Styling */
        .admin-form { max-width: 700px; background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid #333; }
        .form-row { display: flex; gap: 15px; }
        input, select, textarea { width: 100%; padding: 14px; margin: 10px 0; background: #222; border: 1px solid #444; color: #fff; border-radius: 10px; }
        .publish-btn { width: 100%; padding: 18px; background: var(--gold); color: #000; border: none; font-weight: 800; border-radius: 12px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>MALAYALI<br>CONTROL</h2>
        <button class="nav-btn active" onclick="switchTab('dashboard', this)">DASHBOARD</button>
        <button class="nav-btn" onclick="switchTab('add-item', this)">ADD NEW ITEM</button>
        <button class="nav-btn" onclick="switchTab('inventory', this)">INVENTORY LIST</button>
        <button class="nav-btn" onclick="switchTab('orders', this)">ORDERS</button>
    </div>

    <div class="main-content">
        
        <section id="tab-dashboard" class="tab-view active">
            <h1 style="margin-bottom: 25px;">Store Overview</h1>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
                <div style="background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #222;">
                    <h3 style="color: #777; font-size: 0.8rem;">TOTAL ITEMS</h3>
                    <p id="stat-total" style="font-size: 2rem; color: var(--gold); font-family: 'Orbitron';">0</p>
                </div>
                <div style="background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #222;">
                    <h3 style="color: #777; font-size: 0.8rem;">LOW STOCK</h3>
                    <p id="stat-low" style="font-size: 2rem; color: var(--red); font-family: 'Orbitron';">0</p>
                </div>
            </div>
        </section>

        <section id="tab-inventory" class="tab-view">
            <h1>Inventory Manager</h1>
            
            <div class="controls-bar">
                <input type="text" id="searchBar" placeholder="Search product name..." oninput="refreshInventory()">
                
                <select id="filterCategory" onchange="refreshInventory()">
                    <option value="ALL">All Categories</option>
                    <option value="RC CARS">RC CARS</option>
                    <option value="HOT WHEELS">HOT WHEELS</option>
                    <option value="GADGETS">GADGETS</option>
                </select>

                <select id="sortBy" onchange="refreshInventory()">
                    <option value="newest">Sort: Newest First</option>
                    <option value="priceHigh">Price: High to Low</option>
                    <option value="priceLow">Price: Low to High</option>
                    <option value="stockLow">Stock: Low to High</option>
                </select>
            </div>

            <table class="inventory-table">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Price (₹)</th>
                        <th>Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="inventory-body"></tbody>
            </table>
        </section>

        <section id="tab-add-item" class="tab-view">
            <h1>Publish New Product 🚀</h1>
            <div class="admin-form">
                <input type="text" id="pName" placeholder="Product Name">
                <textarea id="pDesc" rows="3" placeholder="Description"></textarea>
                <div class="form-row">
                    <input type="number" id="pPrice" placeholder="Selling Price (₹)">
                    <input type="number" id="pOld" placeholder="Old Price (₹)">
                </div>
                <div class="form-row">
                    <input type="number" id="pStock" placeholder="Stock Quantity">
                    <select id="pCat">
                        <option value="RC CARS">RC CARS</option>
                        <option value="HOT WHEELS">HOT WHEELS</option>
                        <option value="GADGETS">GADGETS</option>
                    </select>
                </div>
                <input type="text" id="i1" placeholder="Main Image URL">
                <button class="publish-btn" onclick="saveToFirebase()">PUBLISH TO STORE</button>
            </div>
        </section>

    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAJi_p1Uuaa66zXEmlFrST_Rx8zMB3LPmM",
            authDomain: "malluhere.firebaseapp.com",
            projectId: "malluhere",
            databaseURL: "https://malluhere-default-rtdb.firebaseio.com",
            appId: "1:682697051518:web:f9069b7cefdf87dfaeb72f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allProducts = [];

        function switchTab(id, btn) {
            document.querySelectorAll('.tab-view').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            btn.classList.add('active');
        }

        // Real-time listener for data
        db.ref('products').on('value', snap => {
            const data = snap.val();
            allProducts = [];
            for(let id in data) {
                allProducts.push({ id, ...data[id] });
            }
            updateStats();
            refreshInventory();
        });

        function updateStats() {
            document.getElementById('stat-total').innerText = allProducts.length;
            document.getElementById('stat-low').innerText = allProducts.filter(p => p.stock < 5).length;
        }

        function refreshInventory() {
            const list = document.getElementById('inventory-body');
            const searchTerm = document.getElementById('searchBar').value.toLowerCase();
            const category = document.getElementById('filterCategory').value;
            const sort = document.getElementById('sortBy').value;

            let filtered = allProducts.filter(p => {
                const matchSearch = p.name.toLowerCase().includes(searchTerm);
                const matchCat = category === "ALL" || p.category === category;
                return matchSearch && matchCat;
            });

            // Sort Logic
            if(sort === "priceHigh") filtered.sort((a,b) => b.price - a.price);
            if(sort === "priceLow") filtered.sort((a,b) => a.price - b.price);
            if(sort === "stockLow") filtered.sort((a,b) => a.stock - b.stock);
            if(sort === "newest") filtered.reverse();

            list.innerHTML = '';
            filtered.forEach(p => {
                list.innerHTML += `
                <tr>
                    <td><b>${p.name}</b></td>
                    <td>${p.category}</td>
                    <td><input type="number" class="edit-input" id="pr-${p.id}" value="${p.price}"></td>
                    <td><input type="number" class="edit-input" id="st-${p.id}" value="${p.stock}"></td>
                    <td>
                        <div class="btn-group">
                            <button class="action-btn save-btn" onclick="quickUpdate('${p.id}')">SAVE</button>
                            <button class="action-btn del-btn" onclick="deleteItem('${p.id}')">DEL</button>
                        </div>
                    </td>
                </tr>`;
            });
        }

        function quickUpdate(id) {
            const newPrice = document.getElementById(`pr-${id}`).value;
            const newStock = document.getElementById(`st-${id}`).value;
            
            db.ref('products/' + id).update({
                price: newPrice,
                stock: newStock
            }).then(() => alert("Product Updated!"));
        }

        function deleteItem(id) {
            if(confirm("Confirm Delete?")) db.ref('products/' + id).remove();
        }

        function saveToFirebase() {
            const product = {
                name: document.getElementById('pName').value,
                desc: document.getElementById('pDesc').value,
                price: document.getElementById('pPrice').value,
                oldPrice: document.getElementById('pOld').value,
                stock: document.getElementById('pStock').value,
                category: document.getElementById('pCat').value,
                img1: document.getElementById('i1').value
            };
            db.ref('products').push(product).then(() => {
                alert("Published!");
                switchTab('inventory', document.querySelectorAll('.nav-btn')[2]);
            });
        }
    </script>
</body>
</html>
