<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malayali Control | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #FFD700; --bg: #0a0a0a; --card: #151515; --red: #ff4444; --green: #25D366; }
        * { margin:0; padding:0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: white; display: flex; min-height: 100vh; overflow-x: hidden; }

        /* Sidebar */
        .sidebar { width: 260px; background: #000; border-right: 1px solid #222; padding: 30px 20px; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 100; }
        .sidebar h2 { font-family: 'Orbitron'; color: var(--gold); font-size: 1.1rem; margin-bottom: 40px; text-align: center; letter-spacing: 2px; }
        .nav-btn { background: none; border: none; color: #888; padding: 15px; text-align: left; cursor: pointer; font-size: 0.9rem; transition: 0.3s; border-radius: 8px; margin-bottom: 10px; font-weight: 600; }
        .nav-btn.active { background: #1a1a1a; color: var(--gold); border-left: 4px solid var(--gold); }
        .nav-btn:hover { color: #fff; background: #111; }

        /* Main Content Area */
        .main-content { flex: 1; margin-left: 260px; padding: 40px; width: calc(100% - 260px); }
        .tab-view { display: none; max-width: 1000px; margin: 0 auto; }
        .tab-view.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from{opacity:0; transform: translateY(10px);} to{opacity:1; transform: translateY(0);} }

        /* Dashboard Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-box { background: var(--card); padding: 25px; border-radius: 15px; border: 1px solid #222; text-align: center; }
        .stat-box h3 { color: #777; font-size: 0.8rem; margin-bottom: 10px; letter-spacing: 1px; }
        .stat-box p { font-family: 'Orbitron'; font-size: 2rem; color: var(--gold); }

        /* Original "Add to Store" Interface */
        .admin-form { background: var(--card); padding: 35px; border-radius: 20px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .admin-form h2 { font-family: 'Orbitron'; color: var(--gold); margin-bottom: 25px; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
        .form-row { display: flex; gap: 15px; }
        input, select, textarea { width: 100%; padding: 14px; margin: 10px 0; background: #222; border: 1px solid #444; color: #fff; border-radius: 10px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--gold); background: #282828; }
        .publish-btn { width: 100%; padding: 18px; background: var(--gold); color: #000; border: none; font-weight: 800; border-radius: 12px; cursor: pointer; margin-top: 20px; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; }
        .publish-btn:hover { background: #e6c200; transform: translateY(-2px); }

        /* Inventory Manager */
        .controls-bar { display: flex; gap: 15px; margin-bottom: 25px; background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #222; }
        .inventory-table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid #222; }
        .inventory-table th { background: #111; color: #777; text-align: left; padding: 18px; font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid #222; }
        .inventory-table td { padding: 15px; border-bottom: 1px solid #222; vertical-align: middle; }
        .edit-input { width: 90px; padding: 8px; background: #222; border: 1px solid #444; color: var(--gold); border-radius: 6px; font-weight: bold; text-align: center; }
        
        .action-group { display: flex; gap: 10px; }
        .btn-save { background: var(--green); color: black; padding: 8px 15px; border-radius: 6px; border: none; font-weight: 700; cursor: pointer; font-size: 0.7rem; }
        .btn-del { background: var(--red); color: white; padding: 8px 15px; border-radius: 6px; border: none; font-weight: 700; cursor: pointer; font-size: 0.7rem; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>MALAYALI<br>CONTROL</h2>
        <button class="nav-btn active" onclick="switchTab('dashboard', this)">DASHBOARD</button>
        <button class="nav-btn" onclick="switchTab('add-item', this)">ADD NEW ITEM</button>
        <button class="nav-btn" onclick="switchTab('inventory', this)">INVENTORY LIST</button>
        <button class="nav-btn" onclick="switchTab('orders', this)">SOLD / ORDERS</button>
    </div>

    <div class="main-content">
        
        <section id="tab-dashboard" class="tab-view active">
            <h1 style="margin-bottom: 25px; font-family: 'Orbitron'; font-size: 1.5rem;">Store Analytics</h1>
            <div class="stats-grid">
                <div class="stat-box"><h3>TOTAL PRODUCTS</h3><p id="stat-total">0</p></div>
                <div class="stat-box"><h3>CRITICAL STOCK ( < 3 )</h3><p id="stat-low" style="color: var(--red);">0</p></div>
                <div class="stat-box"><h3>ACTIVE CATEGORIES</h3><p>3</p></div>
            </div>
            <div class="admin-form" style="display: flex; justify-content: space-between; align-items: center; padding: 25px;">
                <p style="color: #888;">Ready to grow the collection?</p>
                <button class="publish-btn" style="width: auto; margin: 0; padding: 12px 30px;" onclick="switchTab('add-item', document.querySelectorAll('.nav-btn')[1])">Launch Item 🚀</button>
            </div>
        </section>

        <section id="tab-add-item" class="tab-view">
            <div class="admin-form">
                <h2>ADD TO STORE 🚀</h2>
                <input type="text" id="pName" placeholder="Product Name (e.g. L.O.T Cars Flare 2.0)">
                <textarea id="pDesc" rows="3" placeholder="Detailed Product Description..."></textarea>
                
                <div class="form-row">
                    <input type="number" id="pPrice" placeholder="Selling Price (₹)">
                    <input type="number" id="pOld" placeholder="Old Price (₹)">
                </div>

                <div class="form-row">
                    <input type="number" id="pStock" placeholder="Stock Quantity">
                    <select id="pCat">
                        <option value="RC CARS">RC CARS</option>
                        <option value="HOT WHEELS">HOT WHEELS</option>
                        <option value="GADGETS">GADGETS</option>
                    </select>
                </div>

                <input type="text" id="i1" placeholder="Main Image URL">
                <input type="text" id="i2" placeholder="Image 2 URL (Optional)">
                <input type="text" id="i3" placeholder="Image 3 URL (Optional)">
                
                <button class="publish-btn" onclick="saveToFirebase()">PUBLISH TO LIVE STORE</button>
            </div>
        </section>

        <section id="tab-inventory" class="tab-view">
            <h1 style="margin-bottom: 25px; font-family: 'Orbitron'; font-size: 1.5rem;">Inventory Manager</h1>
            
            <div class="controls-bar">
                <input type="text" id="searchBar" placeholder="Search by name..." oninput="refreshInventory()" style="margin:0; flex: 2;">
                <select id="filterCategory" onchange="refreshInventory()" style="margin:0; flex: 1;">
                    <option value="ALL">All Categories</option>
                    <option value="RC CARS">RC CARS</option>
                    <option value="HOT WHEELS">HOT WHEELS</option>
                    <option value="GADGETS">GADGETS</option>
                </select>
                <select id="sortBy" onchange="refreshInventory()" style="margin:0; flex: 1;">
                    <option value="newest">Sort: Newest</option>
                    <option value="priceHigh">Price: High-Low</option>
                    <option value="stockLow">Stock: Low-High</option>
                </select>
            </div>

            <table class="inventory-table">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Price (₹)</th>
                        <th>Stock</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="inventory-body"></tbody>
            </table>
        </section>

    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAJi_p1Uuaa66zXEmlFrST_Rx8zMB3LPmM",
            authDomain: "malluhere.firebaseapp.com",
            projectId: "malluhere",
            databaseURL: "https://malluhere-default-rtdb.firebaseio.com",
            appId: "1:682697051518:web:f9069b7cefdf87dfaeb72f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allProducts = [];

        function switchTab(id, btn) {
            document.querySelectorAll('.tab-view').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            btn.classList.add('active');
        }

        // Data Sync
        db.ref('products').on('value', snap => {
            const data = snap.val();
            allProducts = [];
            for(let id in data) allProducts.push({ id, ...data[id] });
            updateStats();
            refreshInventory();
        });

        function updateStats() {
            document.getElementById('stat-total').innerText = allProducts.length;
            document.getElementById('stat-low').innerText = allProducts.filter(p => p.stock < 3).length;
        }

        function refreshInventory() {
            const list = document.getElementById('inventory-body');
            const searchTerm = document.getElementById('searchBar').value.toLowerCase();
            const cat = document.getElementById('filterCategory').value;
            const sort = document.getElementById('sortBy').value;

            let filtered = allProducts.filter(p => {
                return p.name.toLowerCase().includes(searchTerm) && (cat === "ALL" || p.category === cat);
            });

            if(sort === "priceHigh") filtered.sort((a,b) => b.price - a.price);
            if(sort === "stockLow") filtered.sort((a,b) => a.stock - b.stock);
            if(sort === "newest") filtered.reverse();

            list.innerHTML = filtered.map(p => `
                <tr>
                    <td><b style="color:#eee">${p.name}</b></td>
                    <td style="font-size:0.8rem; color:#888">${p.category}</td>
                    <td><input type="number" class="edit-input" id="pr-${p.id}" value="${p.price}"></td>
                    <td><input type="number" class="edit-input" id="st-${p.id}" value="${p.stock}" style="color:${p.stock < 3 ? '#ff4444':'#25D366'}"></td>
                    <td>
                        <div class="action-group">
                            <button class="btn-save" onclick="quickSave('${p.id}')">SAVE</button>
                            <button class="btn-del" onclick="deleteItem('${p.id}')">DEL</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function quickSave(id) {
            const price = document.getElementById(`pr-${id}`).value;
            const stock = document.getElementById(`st-${id}`).value;
            db.ref('products/' + id).update({ price, stock }).then(() => alert("Saved ✅"));
        }

        function deleteItem(id) {
            if(confirm("Permanently remove this item?")) db.ref('products/' + id).remove();
        }

        function saveToFirebase() {
            const product = {
                name: document.getElementById('pName').value,
                desc: document.getElementById('pDesc').value,
                price: document.getElementById('pPrice').value,
                oldPrice: document.getElementById('pOld').value,
                stock: parseInt(document.getElementById('pStock').value),
                category: document.getElementById('pCat').value,
                img1: document.getElementById('i1').value,
                img2: document.getElementById('i2').value,
                img3: document.getElementById('i3').value,
                timestamp: Date.now()
            };

            if(!product.name || !product.price) return alert("Fill Name and Price!");

            db.ref('products').push(product).then(() => {
                alert("Published Live! 🚀");
                document.querySelectorAll('input, textarea').forEach(el => el.value = "");
                switchTab('inventory', document.querySelectorAll('.nav-btn')[2]);
            });
        }
    </script>
</body>
</html>
