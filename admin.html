<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin | Malayali Here</title>
    <style>
        body { font-family: sans-serif; background: #0a0a0a; color: white; padding: 20px; }
        .admin-card { max-width: 600px; margin: auto; background: #151515; padding: 30px; border-radius: 15px; border: 1px solid #333; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; border-radius: 8px; }
        .add-btn { width: 100%; padding: 15px; background: #FFD700; color: black; border: none; font-weight: bold; cursor: pointer; border-radius: 8px; font-size: 16px; }
        table { width: 100%; margin-top: 30px; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        .del { color: #ff3b30; cursor: pointer; border: none; background: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="admin-card">
    <h2 style="color: #FFD700; margin-bottom: 20px;">ADD PRODUCT 📦</h2>
    <input type="text" id="pName" placeholder="Product Name">
    <textarea id="pDesc" placeholder="Description (e.g. 1:10 Scale Drift Car)"></textarea>
    <div style="display: flex; gap: 10px;">
        <input type="number" id="pPrice" placeholder="Sale Price (₹)">
        <input type="number" id="pOld" placeholder="Original Price (₹)">
    </div>
    <div style="display: flex; gap: 10px;">
        <input type="number" id="pStock" placeholder="Stock Count">
        <select id="pCat">
            <option value="RC CARS">RC CARS</option>
            <option value="HOT WHEELS">HOT WHEELS</option>
            <option value="GADGETS">GADGETS</option>
        </select>
    </div>
    <input type="text" id="pImage" placeholder="Direct Image URL">
    <button class="add-btn" onclick="saveItem()">PUBLISH TO STORE</button>

    <table>
        <thead><tr><th>Name</th><th>Price</th><th>Action</th></tr></thead>
        <tbody id="inventory"></tbody>
    </table>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
    firebase.initializeApp(firebaseConfig); // Use same config as app.js
    const database = firebase.database();

    function saveItem() {
        const item = {
            name: document.getElementById('pName').value,
            desc: document.getElementById('pDesc').value,
            price: document.getElementById('pPrice').value,
            oldPrice: document.getElementById('pOld').value,
            stock: document.getElementById('pStock').value,
            category: document.getElementById('pCat').value,
            image: document.getElementById('pImage').value
        };
        database.ref('products').push(item).then(() => location.reload());
    }

    database.ref('products').on('value', snap => {
        const list = document.getElementById('inventory');
        const data = snap.val();
        list.innerHTML = '';
        for (let id in data) {
            list.innerHTML += `<tr><td>${data[id].name}</td><td>₹${data[id].price}</td><td><button class="del" onclick="remove('${id}')">DELETE</button></td></tr>`;
        }
    });

    function remove(id) { if(confirm("Delete item?")) database.ref('products/' + id).remove(); }
</script>
</body>
</html>
