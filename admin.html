<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard • VIP SHOP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="glass-card p-5 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="text-3xl">👑</div>
                <div>
                    <h1 class="text-xl font-black text-yellow-400">Admin Control Panel</h1>
                    <span class="text-xs text-emerald-400 font-bold">● Active Session</span>
                </div>
            </div>
            <button onclick="logoutAdmin()" class="px-5 py-2 bg-red-500/10 text-red-400 border border-red-500/30 rounded-xl text-sm font-bold hover:bg-red-500/20">Logout</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- ADD APP (PRODUCT) -->
            <div class="glass-card p-6 space-y-4 relative">
                <h2 class="text-sm font-black text-yellow-400 uppercase tracking-wide border-b border-yellow-500/20 pb-2">+ Add New App (Product)</h2>
                
                <input type="text" id="appName" placeholder="App Name (e.g., Malayali VIP iOS)" class="w-full bg-[#111] border border-yellow-500/40 rounded-xl p-3 text-sm focus:outline-none focus:border-yellow-400">
                <input type="text" id="appHint" placeholder="Subtitle (e.g., iOS Hack Update Link in Setup)" class="w-full bg-[#111] border border-yellow-500/40 rounded-xl p-3 text-sm focus:outline-none focus:border-yellow-400">
                
                <div class="bg-[#1a1a1a] p-4 rounded-xl border border-yellow-500/20 space-y-3">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-bold text-yellow-500 uppercase">Pricing Plans</label>
                        <button onclick="addPlanRow()" class="text-xs text-yellow-400 font-bold hover:underline">+ Add Plan</button>
                    </div>
                    <div id="plansContainer" class="space-y-2">
                        <!-- Dynamic plan rows injected here -->
                    </div>
                </div>

                <button onclick="saveApp()" class="w-full btn-gold py-3 rounded-xl text-xs font-black uppercase">Save Application</button>
            </div>

            <!-- ADD KEYS -->
            <div class="glass-card p-6 space-y-4 relative">
                <h2 class="text-sm font-black text-yellow-400 uppercase tracking-wide border-b border-yellow-500/20 pb-2">+ Add Keys for App</h2>
                
                <textarea id="keyStrings" rows="3" placeholder="Enter Key Strings (One per line for bulk add)" class="w-full bg-[#111] border border-yellow-500/40 rounded-xl p-3 text-sm focus:outline-none focus:border-yellow-400 resize-none"></textarea>
                
                <select id="keyAppSelect" onchange="updateKeyPlanDropdown()" class="w-full bg-[#111] border border-yellow-500/40 rounded-xl p-3 text-sm text-white focus:outline-none"></select>
                <select id="keyPlanSelect" class="w-full bg-[#111] border border-yellow-500/40 rounded-xl p-3 text-sm text-white focus:outline-none"></select>
                
                <button onclick="saveKeys()" class="w-full btn-gold py-3 rounded-xl text-xs font-black uppercase">Save Keys</button>
            </div>
        </div>

        <!-- KEY INVENTORY & FILTER -->
        <div class="glass-card p-6 space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-yellow-500/20 pb-3 gap-3">
                <h2 class="text-sm font-black text-yellow-400 uppercase tracking-wide">Keys Inventory Management</h2>
                
                <div class="flex space-x-2 w-full sm:w-auto">
                    <select id="filterApp" onchange="loadInventory()" class="bg-[#111] border border-yellow-500/40 rounded-lg px-3 py-1.5 text-xs text-white">
                        <option value="All">All Apps</option>
                    </select>
                    <select id="filterStatus" onchange="loadInventory()" class="bg-[#111] border border-yellow-500/40 rounded-lg px-3 py-1.5 text-xs text-white">
                        <option value="All">All Status</option>
                        <option value="Live">Live</option>
                        <option value="Sold">Sold</option>
                    </select>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="text-yellow-500 uppercase bg-[#1a1a1a]">
                        <tr>
                            <th class="px-4 py-3 rounded-tl-lg">Key String</th>
                            <th class="px-4 py-3">App & Plan</th>
                            <th class="px-4 py-3">Status</th>
                            <th class="px-4 py-3 text-right rounded-tr-lg">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryList" class="divide-y divide-yellow-500/10">
                        <!-- Inventory rows injected here -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html><!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard • VIP HACKS SHOP</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen p-4 sm:p-6">

    <div class="max-w-4xl mx-auto space-y-6">
        <div class="glass-card rounded-[28px] p-5 sm:p-6 flex items-center justify-between">
            <div>
                <h1 class="text-lg font-black text-yellow-300">Admin Control Panel</h1>
                <span class="text-xs text-emerald-400 font-bold">● Supabase Connected</span>
            </div>
            <button onclick="logoutAdmin()" class="px-4 py-2 bg-red-500/20 text-red-400 rounded-xl text-xs font-bold hover:bg-red-500/30">Logout</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Add Product -->
            <div class="glass-card rounded-[28px] p-5 space-y-3">
                <h3 class="text-sm font-black text-yellow-300 uppercase">+ Create Product Category</h3>
                <input type="text" id="newProdName" placeholder="Product Title (e.g., Malayali iOS VIP)" class="w-full bg-black border border-yellow-500/40 rounded-xl p-3 text-xs">
                <input type="text" id="newProdHint" placeholder="Subtitle / Setup Info" class="w-full bg-black border border-yellow-500/40 rounded-xl p-3 text-xs">
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="price5h" placeholder="5h Price (₹)" class="bg-black border border-yellow-500/40 rounded-xl p-2.5 text-xs">
                    <input type="number" id="price1d" placeholder="1d Price (₹)" class="bg-black border border-yellow-500/40 rounded-xl p-2.5 text-xs">
                    <input type="number" id="price7d" placeholder="7d Price (₹)" class="bg-black border border-yellow-500/40 rounded-xl p-2.5 text-xs">
                    <input type="number" id="price30d" placeholder="30d Price (₹)" class="bg-black border border-yellow-500/40 rounded-xl p-2.5 text-xs">
                </div>
                <button onclick="createNewProduct()" class="w-full btn-gold-gradient py-3 rounded-xl text-xs uppercase">Save Product</button>
            </div>

            <!-- Add Key -->
            <div class="glass-card rounded-[28px] p-5 space-y-3">
                <h3 class="text-sm font-black text-yellow-300 uppercase">+ Add Manual Key</h3>
                <input type="text" id="newKeyStr" placeholder="Key String (e.g. MALAYALI-VIP-8891)" class="w-full bg-black border border-yellow-500/40 rounded-xl p-3 text-xs">
                <select id="keyProdSelect" class="w-full bg-black border border-yellow-500/40 rounded-xl p-3 text-xs"></select>
                <select id="keyDurSelect" class="w-full bg-black border border-yellow-500/40 rounded-xl p-3 text-xs">
                    <option value="5 Hour ⏱️">5 Hour ⏱️</option>
                    <option value="1 Day 💛">1 Day 💛</option>
                    <option value="7 Day 💎">7 Day 💎</option>
                    <option value="30 Day / Month 🔥">30 Day / Month 🔥</option>
                </select>
                <button onclick="addKeyToDatabase()" class="w-full btn-gold-gradient py-3 rounded-xl text-xs uppercase">Save Key</button>
            </div>
        </div>

        <!-- Inventory List -->
        <div class="glass-card rounded-[28px] p-5 space-y-3">
            <h3 class="text-sm font-black text-yellow-300 uppercase">Existing Keys Inventory</h3>
            <div id="keyList" class="space-y-2 max-h-60 overflow-y-auto"></div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
