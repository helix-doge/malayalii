<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login • VIP HACKS SHOP</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass-card rounded-[28px] p-6 space-y-5 max-w-sm w-full">
        <div class="text-center space-y-1">
            <h2 class="text-xl font-black tracking-tight text-yellow-300">Admin Authentication</h2>
            <p class="text-xs text-slate-400">Secure Access to Control Panel</p>
        </div>

        <form onsubmit="handleAdminLogin(event)" class="space-y-4">
            <div>
                <label class="block text-[10px] font-extrabold uppercase tracking-widest text-yellow-400 mb-1.5">Admin ID</label>
                <input type="text" id="adminIdInput" placeholder="Enter Admin ID" required class="w-full bg-black/90 border border-yellow-500/40 rounded-2xl px-4 py-3.5 text-sm font-medium">
            </div>

            <div>
                <label class="block text-[10px] font-extrabold uppercase tracking-widest text-yellow-400 mb-1.5">Password</label>
                <input type="password" id="adminPasswordInput" placeholder="Enter Password" required class="w-full bg-black/90 border border-yellow-500/40 rounded-2xl px-4 py-3.5 text-sm font-medium">
            </div>

            <button type="submit" class="w-full btn-gold-gradient py-4 rounded-2xl uppercase text-xs font-black">Login to Dashboard</button>
        </form>

        <div class="text-center pt-2">
            <a href="index.html" class="text-xs font-bold text-slate-400 hover:text-yellow-400">← Back to Storefront</a>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
