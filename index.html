<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malayali Here Store</title>

  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

  <section class="hero">
    <div class="overlay"></div>

    <!-- TITLE -->
    <div class="left-title">
      <h1>MALAYALI<br>HERE STORE</h1>
      <p>BGMI • PUBG • iOS TOOLS</p>
    </div>

    <!-- MAIN CENTER BUTTONS (PRIMARY) -->
    <div class="center-options">
      <button class="platform-btn" onclick="selectPlatform('android')">
        ANDROID
      </button>
      <button class="platform-btn" onclick="selectPlatform('ios')">
        iOS / iPAD
      </button>
    </div>

    <!-- VISION (SECONDARY) -->
    <div class="vision">
      <h3>VISION</h3>
      <p>
        Our vision is to provide trusted, secure, and high-performance BGMI / PUBG
        iOS tools for Malayali gamers, ensuring smooth gameplay, fast support,
        and a premium user experience.
      </p>
    </div>
  </section>

  <!-- APPS PAGE -->
  <section class="apps hidden" id="appsSection">
    <h2 id="appsTitle">Available Apps</h2>
    <div class="app-grid" id="appGrid"></div>
    <button class="back-btn" onclick="goBack()">← Back</button>
  </section>

  <script src="js/main.js"></script>
</body>
</html>
