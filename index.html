<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mallu Here | RC Car World</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
</head>
<body>

<nav class="navbar">
    <img src="images/logo/logo.png" alt="Mallu Here Logo" class="logo">
    <h1>Mallu Here</h1>
</nav>

<div class="hero" data-aos="fade-down">
    <h2>Fast Cars, Big Smiles! 🏎️💨</h2>
    <p>Premium RC Cars for the Pros.</p>
</div>

<div id="product-list" class="container">
    </div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    // Your Keys go here
    const firebaseConfig = {
        apiKey: "AIzaSyAJi_p1Uuaa66zXEmlFrST_Rx8zMB3LPmM",
        authDomain: "malluhere.firebaseapp.com",
        projectId: "malluhere",
        storageBucket: "malluhere.firebasestorage.app",
        databaseURL: "https://malluhere-default-rtdb.firebaseio.com", // Check your Firebase console for this URL
        messagingSenderId: "682697051518",
        appId: "1:682697051518:web:f9069b7cefdf87dfaeb72f"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Show the cars on the page
    database.ref('products').on('value', (snapshot) => {
        const productList = document.getElementById('product-list');
        const products = snapshot.val();
        productList.innerHTML = ''; 

        for (let id in products) {
            const p = products[id];
            productList.innerHTML += `
                <div class="card" data-aos="zoom-in">
                    <img src="${p.image}" alt="car">
                    <h3>${p.name}</h3>
                    <p class="price">$${p.price}</p>
                    <button class="buy-btn">Add to Cart</button>
                </div>
            `;
        }
    });
</script>

<script src="https://unpkg.com/aos@next/dist/aos.js"></script>
<script>AOS.init();</script>
</body>
</html>
