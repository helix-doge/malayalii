<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malayali Here | Official Store</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
</head>
<body>

<nav class="glass-nav">
    <div class="logo" onclick="showView('home')">MALAYALI HERE</div>
    <div class="nav-links mobile-hide">
        <button onclick="showView('categories')">BROWSE</button>
        <button onclick="window.location.href='admin.html'" class="admin-btn">ADMIN</button>
    </div>
</nav>

<section id="view-home" class="page-view active">
    <div class="hero">
        <div class="hero-content">
            <h1>PREMIUM RC <br><span>COLLECTIONS</span></h1>
            <p>Fast Cars, Big Smiles!</p>
            <button class="cta-btn" onclick="showView('categories')">EXPLORE NOW</button>
        </div>
    </div>
</section>

<section id="view-categories" class="page-view">
    <div class="container">
        <h2 class="section-title">CHOOSE CATEGORY</h2>
        <div class="category-grid">
            <div class="cat-card rc" onclick="openShop('RC CARS')">
                <div class="cat-info"><h3>RC CARS</h3><p>High Speed Drifters</p></div>
            </div>
            <div class="cat-card hw" onclick="openShop('HOT WHEELS')">
                <div class="cat-info"><h3>HOT WHEELS</h3><p>Collectors Edition</p></div>
            </div>
            <div class="cat-card el" onclick="openShop('GADGETS')">
                <div class="cat-info"><h3>GADGETS</h3><p>Tech & Electronics</p></div>
            </div>
        </div>
    </div>
</section>

<section id="view-shop" class="page-view">
    <div class="container">
        <div class="shop-header">
            <button class="back-btn" onclick="showView('categories')">← CATEGORIES</button>
            <h2 id="current-cat-name">PRODUCTS</h2>
        </div>
        <div class="product-grid" id="product-list"></div>
    </div>
</section>

<section id="view-detail" class="page-view">
    <div class="container detail-layout">
        <button class="back-btn" onclick="showView('shop')">← BACK TO LIST</button>
        <div class="detail-container">
            <div class="gallery-side">
                <img id="main-detail-img" src="" class="main-img">
                <div class="thumb-strip" id="detail-thumbs"></div>
            </div>
            <div class="info-side">
                <h1 id="detail-name">Product Name</h1>
                <p class="tagline" id="detail-category">Category</p>
                <div class="price-box">
                    <span class="curr-price" id="detail-price">₹0</span>
                    <span class="old-price" id="detail-old">₹0</span>
                </div>
                <p class="product-description" id="detail-desc">Full description goes here...</p>
                <div class="stock-badge">In Stock: <span id="detail-stock">0</span> units</div>
                <a href="" id="whatsapp-link" class="buy-now">BUY ON WHATSAPP</a>
            </div>
        </div>
    </div>
</section>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="js/app.js"></script>
</body>
</html>
