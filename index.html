<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Malayali Here Store</title>

  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

<!-- TOAST -->
<div id="toast"></div>

<!-- HERO -->
<section class="page hero active" id="heroPage">
  <div class="bg"></div>

  <div class="hero-grid">
    <div class="title">
      <h1>MALAYALI<br>HERE STORE</h1>
      <p>BGMI • PUBG • iOS TOOLS</p>
    </div>

    <div class="buttons">
      <button id="btnAndroid">ANDROID</button>
      <button id="btnIos">iOS / iPAD</button>
    </div>

    <div class="vision">
      <h3>Malayali Here</h3>
      <p>
        Trusted, secure, and premium Android & iOS tools for gamers.
      </p>
    </div>
  </div>
</section>

<!-- APPS -->
<section class="page apps" id="appsPage">
  <h2 id="appsTitle"></h2>
  <div class="app-grid" id="appGrid"></div>
  <button class="back" id="backToHero">← Back</button>
</section>

<!-- PLANS -->
<section class="page plans" id="plansPage">
  <h2 id="plansTitle"></h2>
  <div class="plans-grid" id="plansGrid"></div>
  <button class="back" id="backToApps">← Back</button>
</section>

<script type="module" src="js/main.js"></script>
</body>
</html>
