<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malayali Here Store</title>

  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>MALAYALI HERE STORE</h1>
      <p>Select your platform to continue</p>
    </div>
  </section>

  <!-- PLATFORM SELECTION -->
  <section class="platform-section" id="platformSection">
    <h2>Choose Platform</h2>

    <div class="platform-grid">
      <div class="platform-card" onclick="selectPlatform('android')">
        ANDROID
      </div>

      <div class="platform-card" onclick="selectPlatform('ios')">
        iOS / iPAD
      </div>
    </div>
  </section>

  <!-- APP LIST -->
  <section class="apps-section hidden" id="appsSection">
    <h2 id="appTitle">Available Apps</h2>
    <div class="app-grid" id="appGrid"></div>

    <button class="back-btn" onclick="goBack()">← Back</button>
  </section>

  <script src="js/main.js"></script>
</body>
</html>
