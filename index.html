<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Malayali Here Store</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- FIXED BACKGROUND -->
  <div class="bg-layer"></div>

  <!-- CONTENT WRAPPER -->
  <div class="app-root">

    <!-- HOME -->
    <section id="home" class="page show">
      <div class="hero">

        <div class="title">
          <h1>MALAYALI<br>HERE STORE</h1>
          <p>BGMI • PUBG • iOS TOOLS</p>
        </div>

        <div class="buttons">
          <button id="androidBtn">ANDROID</button>
          <button id="iosBtn">iOS / iPAD</button>
        </div>

        <div class="vision">
          <h3>VISION</h3>
          <p>
            We provide trusted, secure, and high-performance BGMI / PUBG
            Android & iOS tools for Malayali gamers, ensuring smooth gameplay,
            fast support, and a premium user experience.
          </p>
        </div>

      </div>
    </section>

    <!-- APPS PAGE -->
    <section id="apps" class="page">
      <h2 id="appsTitle"></h2>
      <div id="appGrid" class="app-grid"></div>
      <button id="backBtn" class="back">← Back</button>
    </section>

    <!-- PLANS PAGE -->
<section id="plans" class="page">
  <h2 id="plansTitle"></h2>

  <div id="plansGrid" class="plans-grid"></div>

  <button id="plansBackBtn" class="back">← Back</button>
</section>
  

  </div>

  <script src="js/main.js"></script>
</body>
</html>
