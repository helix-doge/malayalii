<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Malayali Here Store</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- BACKGROUND (USED BY ALL PAGES) -->
  <div class="bg"></div>

  <!-- ================= HOME / HERO ================= -->
  <section id="home" class="page active">
    <div class="hero-grid">

      <div class="title">
        <h1>MALAYALI<br>HERE STORE</h1>
        <p>BGMI • PUBG • iOS TOOLS</p>
      </div>

      <div class="buttons">
        <button id="androidBtn">ANDROID</button>
        <button id="iosBtn">iOS / iPAD</button>
      </div>

      <div class="vision">
        <h3>VISION</h3>
        <p>
          We provide trusted, secure, and high-performance BGMI / PUBG
          Android & iOS tools for Malayali gamers.
        </p>
      </div>

    </div>
  </section>

  <!-- ================= APPS PAGE ================= -->
  <section id="apps" class="page">
    <h2 id="appsTitle"></h2>

    <div class="app-grid" id="appGrid"></div>

    <button class="back" id="backBtn">← Back</button>
  </section>

  <script src="js/main.js"></script>
</body>
</html>
