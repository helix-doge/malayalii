<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malayali Here | Official Store</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<nav class="glass-nav">
    <div class="logo" onclick="showView('home')">MALAYALI HERE</div>
    <div class="nav-links">
        <button onclick="showView('categories')">COLLECTIONS</button>
        <button onclick="window.location.href='admin.html'" class="admin-link">ADMIN</button>
    </div>
</nav>

<section id="view-home" class="page-view active">
    <div class="hero">
        <div class="hero-text">
            <h1>PREMIUM RC <br><span>COLLECTIONS</span></h1>
            <p>Fast Cars, Big Smiles!</p>
            <button class="cta-btn" onclick="showView('categories')">START SHOPPING</button>
        </div>
    </div>
</section>

<section id="view-categories" class="page-view">
    <div class="container">
        <h2 class="title">CHOOSE CATEGORY</h2>
        <div class="cat-grid">
            <div class="cat-card rc-bg" onclick="openShop('RC CARS')">
                <div class="cat-overlay"><h3>RC CARS</h3><p>High Speed Drifters</p></div>
            </div>
            <div class="cat-card hw-bg" onclick="openShop('HOT WHEELS')">
                <div class="cat-overlay"><h3>HOT WHEELS</h3><p>Collectors Edition</p></div>
            </div>
            <div class="cat-card gd-bg" onclick="openShop('GADGETS')">
                <div class="cat-overlay"><h3>GADGETS</h3><p>Tech & Electronics</p></div>
            </div>
        </div>
    </div>
</section>

<section id="view-shop" class="page-view">
    <div class="container">
        <div class="shop-header">
            <button class="back-link" onclick="showView('categories')">← BACK</button>
            <h2 id="active-cat-title">PRODUCTS</h2>
        </div>
        <div class="product-grid" id="product-display"></div>
    </div>
</section>

<section id="view-detail" class="page-view">
    <div class="container detail-wrapper">
        <button class="back-link" onclick="showView('shop')">← BACK TO LIST</button>
        <div class="product-main">
            <div class="gallery-col">
                <div class="main-frame"><img id="det-img" src=""></div>
                <div class="thumb-row" id="det-thumbs"></div>
            </div>
            <div class="info-col">
                <span class="badge" id="det-cat">CATEGORY</span>
                <h1 id="det-name">Product Name</h1>
                <div class="price-strip">
                    <span class="price-now" id="det-price">₹0</span>
                    <span class="price-old" id="det-old">₹0</span>
                </div>
                <p class="description" id="det-desc">Product information goes here...</p>
                <div class="status">In Stock: <b id="det-stock">0</b> units</div>
                <a href="" id="wa-btn" class="buy-btn">BUY ON WHATSAPP</a>
            </div>
        </div>
    </div>
</section>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="script.js"></script>
</body>
</html>
