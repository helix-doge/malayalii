<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Malayali Here Store</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- FIXED BACKGROUND -->
  <div class="bg-layer"></div>

  <!-- APP ROOT -->
  <div class="app-root">

    <!-- ================= HOME PAGE ================= -->
    <section id="home" class="page show">
      <div class="hero">

        <div class="title">
          <h1>MALAYALI<br>HERE STORE</h1>
          <p>BGMI • PUBG • iOS TOOLS</p>
        </div>

        <div class="buttons">
          <button id="androidBtn" type="button">ANDROID</button>
          <button id="iosBtn" type="button">iOS / iPAD</button>
        </div>

        <div class="vision">
          <h3>VISION</h3>
          <p>
            We provide trusted, secure, and high-performance BGMI / PUBG
            Android & iOS tools for Malayali gamers, ensuring smooth gameplay,
            fast support, and a premium user experience.
          </p>
        </div>

      </div>
    </section>

    <!-- ================= APPS PAGE ================= -->
    <section id="apps" class="page">
      <h2 id="appsTitle"></h2>
      <div id="appGrid" class="app-grid"></div>
      <button id="backBtn" class="back" type="button">← Back</button>
    </section>

    <!-- ================= APP DETAILS / BUY PAGE ================= -->
    <section id="appDetails" class="page">
      <div class="app-details">

        <img id="detailsIcon" class="details-icon" src="" alt="App Icon">
        <h2 id="detailsName"></h2>

        <div class="plan-select" id="planSelect">
          <h3>Select Plan</h3>
        </div>

        <button id="buyBtn" class="buy-btn" type="button">Buy Key</button>
        <button id="detailsBackBtn" class="back" type="button">← Back</button>

      </div>
    </section>

  </div>

  <!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/main.js"></script>

</body>
</html>
