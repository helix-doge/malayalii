<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Malayali Here Store</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- FIXED BACKGROUND -->
  <div class="bg-layer"></div>

  <!-- APP ROOT -->
  <div class="app-root">

    <!-- HOME -->
    <section id="home" class="page show">
      <div class="hero">

        <div class="title">
          <h1>MALAYALI<br>HERE STORE</h1>
          <p>BGMI • PUBG • iOS TOOLS</p>
        </div>

        <div class="buttons">
          <button id="androidBtn">ANDROID</button>
          <button id="iosBtn">iOS / iPAD</button>
        </div>

        <div class="vision">
          <h3>VISION</h3>
          <p>
            Trusted, secure, and high-performance Android & iOS tools
            with fast support and premium experience.
          </p>
        </div>

      </div>
    </section>

    <!-- APPS -->
    <section id="apps" class="page">
      <h2 id="appsTitle"></h2>
      <div id="appGrid" class="app-grid"></div>
      <button id="backBtn" class="back">← Back</button>
    </section>

    <!-- DETAILS -->
    <section id="appDetails" class="page">
      <div class="app-details">
        <img id="detailsIcon" class="details-icon">
        <h2 id="detailsName"></h2>

        <div id="planSelect" class="plan-select">
          <h3>Select Plan</h3>
        </div>

        <button id="buyBtn" class="buy-btn">Buy Key</button>
        <button id="detailsBackBtn" class="back">← Back</button>
      </div>
    </section>

  </div>

  <!-- SUPABASE CDN (REQUIRED) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- MAIN JS -->
  <script src="js/main.js"></script>
</body>
</html>
