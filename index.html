<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malayali Here | Official Premium Store</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<nav>
    <div class="logo" onclick="navigateTo('/')">MALAYALI HERE</div>
    <div class="nav-links">
        <button onclick="navigateTo('/rc-cars')">RC CARS</button>
        <button onclick="navigateTo('/hot-wheels')">HOT WHEELS</button>
        <button onclick="window.location.href='admin.html'">ADMIN</button>
    </div>
</nav>

<div id="view-home" class="view">
    <section class="hero">
        <div class="hero-content">
            <h1>MALAYALI HERE</h1>
            <p>PREMIUM DRIFT CARS & COLLECTIBLES</p>
            <button class="cta-btn" onclick="navigateTo('/rc-cars')">EXPLORE NOW</button>
        </div>
    </section>

    <section class="cat-section">
        <h2>OUR COLLECTIONS</h2>
        <div class="cat-grid">
            <div class="cat-card" onclick="navigateTo('/rc-cars')">🏎️ RC DRIFT</div>
            <div class="cat-card" onclick="navigateTo('/hot-wheels')">🔥 HOT WHEELS</div>
            <div class="cat-card" onclick="navigateTo('/electronics')">🔌 GADGETS</div>
        </div>
    </section>
</div>

<div id="view-shop" class="view" style="display:none;">
    <section class="shop-header">
        <h2 id="current-category">Collection</h2>
    </section>
    <div class="product-grid" id="product-list">
        </div>
</div>

<footer>
    <div class="footer-grid">
        <div><h4>MALAYALI HERE</h4><p>Premium RC Gear in Kerala.</p></div>
        <div><h4>CONTACT</h4><p>admin@malluhere.shop</p></div>
    </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="script.js"></script>
</body>
</html>
